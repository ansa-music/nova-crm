name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Только владелец репозитория. Репозиторий публичный: без этой проверки
    # любой человек с GitHub-аккаунтом мог написать «/oc …» в issue и
    # запустить агента с правом записи в код — а пуш в main = деплой сайта.
    if: |
      github.event.comment.author_association == 'OWNER' && (
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          VYCEAI_API_KEY: ${{ secrets.VYCEAI_API_KEY }}
        with:
          model: vyceai/claude-sonnet-4-6
