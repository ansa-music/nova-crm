name: Deploy Nova CRM to Firebase Hosting

# Runs automatically on every push to main, and can also be triggered
# manually from the "Actions" tab on GitHub ("Run workflow" button).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      # SQL строк таблиц (supabase/migrations/*.sql) — в Supabase САМ, до
      # выкладки сайта: новому коду нужны его функции и политики. Накатываются
      # только изменившиеся файлы, каждый одной транзакцией; ошибка останавливает
      # деплой (сайт не уйдёт вперёд базы). Нет секрета — шаг пропускается.
      # Секрет — ОДИН из: SUPABASE_ACCESS_TOKEN (личный токен Supabase) или
      # SUPABASE_DB_URL (строка «Session pooler» из Supabase → Connect).
      - name: Apply Supabase SQL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/supabase-sql.mjs apply --if-configured

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting,firestore:rules,firestore:indexes --project nurba-6e70d --token "${{ secrets.FIREBASE_TOKEN }}"
